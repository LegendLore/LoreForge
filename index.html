<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Loreforge</title>
<style>
:root{--ink:#2c2117;--paper:#ead7ad;--paper2:#f6eaca;--wood:#5d341e;--wood2:#321a0f;--line:#a47e52;--accent:#7a2f21}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:Georgia,serif;background:linear-gradient(#0005,#0005),repeating-linear-gradient(90deg,#5b331d 0 16px,#472514 16px 32px,#674027 32px 48px)}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.top{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;padding:12px 14px;color:#fff0d1;background:linear-gradient(#704226,#3b2113);border-bottom:3px solid #c89b54;box-shadow:0 4px 14px #0008}.brand{font-weight:700;letter-spacing:.09em}.top select{margin-left:auto;max-width:50vw;padding:8px;border-radius:8px;background:#f5e8c7}main{max-width:1100px;margin:auto;padding:14px 14px 90px}.paper{background:radial-gradient(circle at 15% 5%,#fff8,transparent 30%),linear-gradient(var(--paper2),var(--paper));border:1px solid #aa875d;border-radius:14px;box-shadow:0 8px 24px #1b0f0870,inset 0 0 32px #6f4a2017;padding:16px;margin-bottom:14px}h1,h2,h3{margin:.2em 0 .55em}.muted{color:#6f5b46}.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.card{background:#f8edd4;border:1px solid #b28f65;border-radius:11px;padding:12px}.kpi{text-align:center}.kpi strong{display:block;font-size:1.5rem}.section{display:flex;align-items:center;gap:8px}.section .btn{margin-left:auto}.btn{border:1px solid #64351e;border-radius:8px;padding:9px 12px;color:#fff4dc;background:linear-gradient(#8a5130,#57301c);box-shadow:0 2px 0 #2d170d}.btn.secondary{color:#2c2117;background:#ead4aa;border-color:#9b774e}.btn.danger{background:#7a2f21}.list{display:grid;gap:9px}.item{display:flex;gap:10px;align-items:center;background:#f8ecd0;border:1px solid #b28f65;border-radius:10px;padding:11px}.grow{flex:1}.title{font-weight:700}.small{font-size:.84rem}.thumb{width:46px;height:46px;border-radius:8px;border:1px solid #9b774e;background:#cbb184;object-fit:cover;displ columns:1fr 1fr}}
</style></head><body><div class="app"><header class="top"><div class="brand">LOREFORGE</div><select id="world"></select></header><main id="view"></main><nav class="bottom"><button class="nav active" data-v="home">Home</button><button class="nav" data-v="entries">Entries</button><button class="nav" data-v="threads">Threads</button><button class="nav" data-v="sessions">Sessions</button><button class="nav" data-v="search">Search</button><button class="nav" data-v="settings">Settings</button></nav></div>
<dialog id="editor"><div class="mhead"><strong id="etitle">New Entry</strong><button onclick="editor.close()">×</button></div><form id="form" class="mbody"></form></dialog><input id="importer" type="file" accept="application/json,.json" class="hidden">
<script>
const TYPES=['NPC','Location','Faction','Item','Story Thread','Session'],STATES=['Draft','Active','Archived'],CONDS=['Alive','Dead','Missing','Hidden','Destroyed','Unknown','Not applicable'],CANON=['Established canon','Player-known','Rumor','GM secret','Planned'],THREADS=['Seed','Open','Advancing','Dormant','Resolved','Abandoned'];
const RELS=[['Lives in','Has resident'],['Located in','Contains'],['Member of','Has member'],['Leads','Serves'],['Owns','Owned by'],['Created','Created by'],['Allied with','Allied with'],['Enemy of','Enemy of'],['Related to','Related to'],['Appeared in','Featured'],['Connected to','Connected to'],['Knows','Known by'],['Protects','Protected by'],['Seeks','Sought by'],['Serves','Leads'],['Opposes','Opposed by'],['Travels to','Visited by'],['Contains','Located in'],['Reveals','Revealed by']];
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const mk=(name,type,description,tags,extra={})=>({id:uid(),worldId:null,name,type,description,tags,recordState:'Active',canon:'Established canon',condition:'Not applicable',image:'',notes:'',relationships:[],created:new Date().toISOString(),updated:new Date().toISOString(),...extra});
const seed={version:1,worlds:[{id:uid(),name:'Where the Map Ends',system:'Avatar Legends',description:'A hidden-land campaign where the heroes’ flight beyond the known map draws the Fire Nation toward Senra.'}],entries:[mk('Admiral Kazan Ryu','NPC','Primary antagonist. A charismatic Fire Nation commander who arrives as a benefactor before tightening control.',['Villain','Fire Nation','Recurring'],{role:'Admiral',goals:'Reach Senra, secure spiritual power, and establish Fire Nation dominance.',secrets:'He intends to bind four minor spirits into a weapon.',condition:'Alive'}),mk('General Uyanga','NPC','A relentless Fire Nation commander pursuing rebels and the missing route beyond the map.',['Fire Nation','Military'],{role:'General',goals:'Capture the party and recover the route.',condition:'Alive'}),mk('Pasho the Jar Merchant','NPC','A traveling merchant and recurring source of levity, gossip, and inconvenient timing.',['Merchant','Comic relief'],{role:'Merchant',condition:'Alive'}),mk('Western Air Temple','Location','An abandoned Air Nomad complex containing a great library, meditation chambers, vents, lifts, and hidden records.',['Air Nomad','Ruins','Exploration'],{region:'Earth Kingdom',features:'Great Library; Hall of Statues; Meditation Circle; Mushroom Bridge; Elevator Chamber',secrets:'Records here reveal a route beyond the known map.',condition:'Hidden'}),mk('Senra','Location','A hidden hill-clan society beyond the Spirit Seas, shaped by stewardship, sacred ember traditions, drought, and growing inequality.',['Hidden lands','Spirit','Village'],{region:'Beyond the map',features:'Ash Clan settlements; Scale Houses; sacred ember traditions',condition:'Hidden'}),mk('Spirit Seas','Location','Dangerous waters that isolated Senra after ancient routes became impassable.',['Ocean','Spirit'],{region:'Beyond known maps',condition:'Unknown'}),mk('Fire Nation','Faction','An expansionist industrial power seeking military and spiritual advantage.',['Military','Empire'],{goals:'Expansion, industrial power, and domination.',resources:'Fleet, soldiers, steel, medicine, and propaganda.'}),mk('Ash Clan','Faction','Traditional hill clans who treat fire as a communal responsibility rather than private property.',['Senra','Traditionalists'],{goals:'Protect Senra’s traditions and sacred ember.'}),mk('Scale Houses','Faction','Merchant houses whose trade networks create wealth, leverage, and social tension within Senra.',['Senra','Merchants'],{goals:'Trade, prosperity, and influence.'}),mk('Coal Walkers','Faction','Custodians who carry the sacred ember and train young Ember Witnesses.',['Senra','Sacred order'],{goals:'Preserve the ember and its obligations.'}),mk('Spirit of Ember','Item','A minor spirit bound within a log, capable of powering Ryu’s ship if captured.',['Spirit','Major plot'],{itemType:'Spirit-bound relic',importance:'Central campaign artifact',condition:'Unknown'}),mk('Ancient Route Map','Item','A divided map showing a path through the Spirit Seas to forgotten lands.',['Map','Quest'],{itemType:'Map',importance:'Gateway to Senra'}),mk('The Stolen Ember','Story Thread','Ryu seeks to capture the Spirit of Ember and turn it into an engine of war.',['Main plot','Spirit'],{threadStatus:'Open',questions:'Can the spirit be rescued? Can Senra survive contact with the Fire Nation?',planned:'Ryu gains trust, establishes a garrison, locates the ember, and attempts extraction.'}),mk('Fire Nation Pursuit','Story Thread','The party’s escape route risks leading the Fire Nation directly to people who believed themselves forgotten.',['Main plot','Chase'],{threadStatus:'Advancing',questions:'Can the party protect Senra from danger they helped bring?'})],trash:[]};seed.entries.forEach(x=>x.worldId=seed.worlds[0].id);
let db=(()=>{try{return JSON.parse(localStorage.getItem('loreforge-db'))||seed}catch{return seed}})(),wid=db.worlds[0]?.id,screen='home';const save=()=>localStorage.setItem('loreforge-db',JSON.stringify(db)),all=()=>db.entries.filter(x=>x.worldId===wid),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])),ico=t=>({'NPC':'👤','Location':'⌖','Faction':'⚑','Item':'✦','Story Thread':'🧵','Session':'📖'}[t]||'◆');
function row(x){return `<div class="item" onclick="detail('${x.id}')">${x.image?`<img class="thumb" src="${x.image}">`:`<div class="thumb">${ico(x.type)}</div>`}<div class="grow"><div class="title">${esc(x.name)}</div><div class="small muted">${esc(x.type)} · ${esc(x.recordState)}</div></div><span>›</span></div>`}
function render(){world.innerHTML=db.worlds.map(w=>`<option value="${w.id}" ${w.id===wid?'selected':''}>${esc(w.name)}</option>`).join('');document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.v===screen));if(screen==='home')home();if(screen==='entries')entries();if(screen==='threads')typed('Story Thread');if(screen==='sessions')typed('Session');if(screen==='search')search();if(screen==='settings')settings()}
function home(){const a=all(),open=a.filter(x=>x.type==='Story Thread'&&!['Resolved','Abandoned'].includes(x.threadStatus||'Open')),recent=[...a].sort((x,y)=>y.updated.localeCompare(x.updated)).slice(0,5),w=db.worlds.find(x=>x.id===wid);view.innerHTML=`<section class="paper"><h1>${esc(w.name)}</h1><p class="muted">${esc(w.description)}</p><div class="kpis">${['NPC','Location','Faction','Item'].map(t=>`<div class="card kpi"><strong>${a.filter(x=>x.type===t).length}</strong>${t}s</div>`).join('')}</div></section><section class="paper"><div class="section"><h2>Open story threads</h2><button class="btn" onclick="openEditor(null,'Story Thread')">Add</button></div>${open.length?`<div class="list">${open.map(row).join('')}</div>`:'<div class="empty">No open threads.</div>'}</section><section class="paper"><div class="section"><h2>Recently touched</h2><button class="btn secondary" onclick="openEditor()">New entry</button></div>${recent.length?`<div class="list">${recent.map(row).join('')}</div>`:'<div class="empty">The archive is waiting for ink.</div>'}</section>`}
function entries(){view.innerHTML=`<section class="paper"><div class="section"><h1>Entries</h1><button class="btn" onclick="openEditor()">New</button></div><div class="toolbar"><input id="q" placeholder="Filter entries…" oninput="filter()"><select id="ft" onchange="filter()"><option value="">All types</option>${TYPES.map(t=>`<option>${t}</option>`).join('')}</select></div><div id="elist" class="list">${all().map(row).join('')}</div></section>`}function filter(){const z=q.value.toLowerCase(),t=ft.value,a=all().filter(x=>(!t||x.type===t)&&JSON.stringify(x).toLowerCase().includes(z));elist.innerHTML=a.length?a.map(row).join(''):'<div class="empty">Nothing found.</div>'}
function typed(t){const a=all().filter(x=>x.type===t);view.innerHTML=`<section class="paper"><div class="section"><h1>${t==='Session'?'Sessions':'Story Threads'}</h1><button class="btn" onclick="openEditor(null,'${t}')">Add</button></div>${a.length?`<div class="list">${a.map(row).join('')}</div>`:`<div class="empty">No ${t.toLowerCase()} entries.</div>`}</section>`}
function search(){view.innerHTML=`<section class="paper"><h1>Search the archive</h1><input id="sq" placeholder="Search names, notes, tags, relationships…" oninput="runSearch()"><div id="results" class="list" style="margin-top:12px"></div></section>`}function runSearch(){const z=sq.value.trim().toLowerCase();results.innerHTML=!z?'':(()=>{const a=all().filter(x=>JSON.stringify(x).toLowerCase().includes(z));return a.length?a.map(row).join(''):'<div class="empty">No matching lore.</div>'})()}
function settings(){const w=db.worlds.find(x=>x.id===wid);view.innerHTML=`<section class="paper"><h1>World settings</h1><label>World name</label><input id="wn" value="${esc(w.name)}"><label>System</label><input id="ws" value="${esc(w.system||'')}"><label>Description</label><textarea id="wd">${esc(w.description||'')}</textarea><div class="actions"><button class="btn" onclick="saveWorld()">Save world</button><button class="btn secondary" onclick="newWorld()">New world</button></div></section><section class="paper"><h2>Backup and transfer</h2><p class="muted">Exports include entries and uploaded images.</p><div class="actions"><button class="btn" onclick="exportDB()">Export JSON</button><button class="btn secondary" onclick="importer.click()">Import JSON</button></div></section><section class="paper"><h2>Recently deleted</h2>${db.trash.length?`<div class="list">${db.trash.map(x=>`<div class="item"><div class="grow"><div class="title">${esc(x.name)}</div><div class="small muted">${esc(x.type)}</div></div><button class="btn secondary" onclick="restore('${x.id}')">Restore</button></div>`).join('')}</div>`:'<div class="empty">Nothing deleted.</div>'}</section>`}
function saveWorld(){const w=db.worlds.find(x=>x.id===wid);w.name=wn.value.trim()||'Untitled World';w.system=ws.value;w.description=wd.value;save();render()}function newWorld(){const n=prompt('World name?');if(!n)return;const w={id:uid(),name:n,system:'',description:''};db.worlds.push(w);wid=w.id;save();render()}function exportDB(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='loreforge-backup.json';a.click();URL.revokeObjectURL(a.href)}importer.onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const p=JSON.parse(await f.text());if(!p.worlds||!p.entries)throw 0;db=p;wid=db.worlds[0]?.id;save();render();alert('Loreforge backup imported.')}catch{alert('Not a valid Loreforge backup.')}e.target.value=''};
function dyn(v){const map={NPC:[['role','Role'],['goals','Goals'],['secrets','Secrets']],Location:[['region','Region'],['features','Important features'],['secrets','Secrets']],Faction:[['goals','Goals'],['leadership','Leadership'],['territory','Territory'],['resources','Resources']],Item:[['itemType','Item type'],['origin','Origin'],['abilities','Abilities'],['importance','Importance']], 'Story Thread':[['threadStatus','Thread status','select'],['questions','Questions'],['planned','Planned developments']],Session:[['sessionDate','Session date','date'],['recap','Recap'],['unresolved','Unresolved questions']]};return `<div class="grid">${(map[v.type]||[]).map(([n,l,k])=>`<div><label>${l}</label>${k==='select'?`<select name="${n}">${THREADS.map(s=>`<option ${v[n]===s?'selected':''}>${s}</option>`).join('')}</select>`:k==='date'?`<input type="date" name="${n}" value="${esc(v[n]||'')}">`:`<textarea name="${n}">${esc(v[n]||'')}</textarea>`}</div>`).join('')}</div>`}
function relrow(r={}){return `<div class="rel"><div><label>Relationship</label><select name="rt">${RELS.map(([a])=>`<option ${r.type===a?'selected':''}>${a}</option>`).join('')}<option ${!RELS.some(z=>z[0]===r.type)?'selected':''}>Custom</option></select></div><div><label>Target</label><select name="rg"><option value="">Choose…</option>${all().map(x=>`<option value="${x.id}" ${r.targetId===x.id?'selected':''}>${esc(x.name)} (${x.type})</option>`).join('')}</select></div><button type="button" class="btn danger" onclick="this.parentElement.remove()">×</button></div>`}
function openEditor(id=null,type='NPC'){const x=id?db.entries.find(e=>e.id===id):null,v=x||{type,name:'',description:'',tags:[],recordState:'Active',canon:'Established canon',condition:'Not applicable',image:'',notes:'',relationships:[]};etitle.textContent=x?`Edit ${x.name}`:`New ${type}`;form.innerHTML=`<input type="hidden" name="id" value="${v.id||''}"><div class="grid"><div><label>Type</label><select name="type">${TYPES.map(t=>`<option ${v.type===t?'selected':''}>${t}</option>`).join('')}</select></div><div><label>Name or title</label><input name="name" required value="${esc(v.name)}"></div><div><label>Record state</label><select name="recordState">${STATES.map(s=>`<option ${v.recordState===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>In-world condition</label><select name="condition">${CONDS.map(s=>`<option ${v.condition===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Canon marking</label><select name="canon">${CANON.map(s=>`<option ${v.canon===s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Tags</label><input name="tags" value="${esc((v.tags||[]).join(', '))}"></div></div><label>Description / summary</label><textarea name="description">${esc(v.description||'')}</textarea><div id="dynamic">${dyn(v)}</div><label>Image URL</label><input name="image" value="${esc(v.image||'')}"><label>Or upload image</label><input id="upload" type="file" accept="image/*"><label>Notes</label><textarea name="notes">${esc(v.notes||'')}</textarea><hr><div class="section"><h3>Relationships</h3><button type="button" class="btn secondary" onclick="addrel()">Add link</button></div><div id="rels">${(v.relationships||[]).filter(r=>!r.auto).map(relrow).join('')}</div><div class="actions"><button class="btn" type="submit">Save</button>${x?`<button type="button" class="btn danger" onclick="removeEntry('${x.id}')">Delete</button>`:''}<button type="button" class="btn secondary" onclick="editor.close()">Cancel</button></div>`;form.type.onchange=()=>dynamic.innerHTML=dyn({type:form.type.value});form.onsubmit=saveEntry;editor.showModal()}function addrel(){rels.insertAdjacentHTML('beforeend',relrow())}function dataurl(f){return new Promise((r,j)=>{const q=new FileReader;q.onload=()=>r(q.result);q.onerror=j;q.readAsDataURL(f)})}
async function saveEntry(ev){ev.preventDefault();const fd=new FormData(form),id=fd.get('id'),old=id?db.entries.find(x=>x.id===id):null,x=old||{id:uid(),worldId:wid,created:new Date().toISOString(),relationships:[]};for(const [k,v] of fd.entries())if(!['id','rt','rg'].includes(k))x[k]=v;x.tags=String(fd.get('tags')||'').split(',').map(s=>s.trim()).filter(Boolean);x.updated=new Date().toISOString();const ts=[...form.querySelectorAll('[name=rt]')].map(e=>e.value),gs=[...form.querySelectorAll('[name=rg]')].map(e=>e.value);x.relationships=ts.map((type,i)=>gs[i]?{type,targetId:gs[i]}:null).filter(Boolean);if(upload.files[0])x.image=await dataurl(upload.files[0]);if(!old)db.entries.push(x);sync(x);save();editor.close();render()}function sync(src){db.entries.forEach(t=>t.relationships=(t.relationships||[]).filter(r=>!(r.auto&&r.targetId===src.id)));(src.relationships||[]).forEach(r=>{const t=db.entries.find(x=>x.id===r.targetId);if(!t)return;const p=RELS.find(([a])=>a===r.type),rev=p?p[1]:`Related from: ${r.type}`;t.relationships=t.relationships||[];t.relationships.push({type:rev,targetId:src.id,auto:true})})}
function detail(id){const x=db.entries.find(e=>e.id===id);if(!x)return,screen='detail';const backs=all().filter(e=>(e.relationships||[]).some(r=>r.targetId===id));const skip=new Set(['id','worldId','name','type','description','tags','recordState','canon','condition','image','notes','relationships','created','updated']);const extras=Object.entries(x).filter(([k,v])=>!skip.has(k)&&v);view.innerHTML=`<section class="paper"><div class="section"><h1>${ico(x.type)} ${esc(x.name)}</h1><button class="btn" onclick="openEditor('${x.id}')">Edit</button></div><div>${(x.tags||[]).map(t=>`<span class="badge">${esc(t)}</span>`).join('')}<span class="badge">${esc(x.canon)}</span></div>${x.image?`<img src="${x.image}" style="width:100%;max-height:340px;object-fit:cover;border-radius:12px;margin:12px 0">`:''}<p>${esc(x.description).replace(/\n/g,'<br>')}</p>${extras.length?`<div class="card">${extras.map(([k,v])=>`<p><strong>${esc(k.replace(/([A-Z])/g,' $1').replace(/^./,c=>c.toUpperCase()))}:</strong><br>${esc(v)}</p>`).join('')}</div>`:''}${x.notes?`<div class="note"><strong>Notes</strong><br>${esc(x.notes).replace(/\n/g,'<br>')}</div>`:''}</section><section class="paper"><h2>Relationships</h2>${(x.relationships||[]).length?`<div class="list">${x.relationships.map(r=>{const t=db.entries.find(e=>e.id===r.targetId);return t?`<div class="item" onclick="detail('${t.id}')"><div class="grow"><div class="small muted">${esc(r.type)}</div><div class="title">${esc(t.name)}</div></div><span>›</span></div>`:''}).join('')}</div>`:'<div class="empty">No links yet.</div>'}</section><section class="paper"><h2>Referenced by</h2>${backs.length?`<div class="list">${backs.map(row).join('')}</div>`:'<div class="empty">No backlinks yet.</div>'}</section>`;document.querySelectorAll('.nav').forEach(b=>b.classList.remove('active'))}
function removeEntry(id){const i=db.entries.findIndex(x=>x.id===id);if(i<0||!confirm('Move this entry to Recently Deleted?'))return;db.trash.push(db.entries.splice(i,1)[0]);save();editor.close();screen='entries';render()}function restore(id){const i=db.trash.findIndex(x=>x.id===id);if(i<0)return;db.entries.push(db.trash.splice(i,1)[0]);save();render()}
document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>{screen=b.dataset.v;render()});world.onchange=e=>{wid=e.target.value;render()};render();
</script></body></html>
